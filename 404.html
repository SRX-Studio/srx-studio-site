
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script>
    sessionStorage.setItem(
      "redirectPath",
      window.location.pathname +
      window.location.search +
      window.location.hash
    );
    window.location.replace("/");
  </script>
</head>
<body></body>
</html>
